# Global Costmap Fusion Node Configuration
# GlobalCostmapFusion Configuration

global_costmap_fusion:
  ros__parameters:
    robot_ids: ["robot1", "robot2", "robot3", "robot4", "robot5", "robot6"]
    robot_radius: 0.3          # Radius of each robot in meters
    exclusion_buffer: 0.1      # Additional buffer around robots to exclude from obstacle detection
    
    # Update frequencies
    update_frequency: 10.0     # Hz - How often to publish shared obstacles grid
    robot_timeout: 5.0         # Seconds - Time before marking robot as inactive
    
    # Frame and topic configuration
    global_frame: map
    scan_topic: scan
    map_topic: /map
    map_service: "map_server/map"
    base_frame_suffix: /base_footprint

    # Lidar configuration
    # Readings that are inf or >= lidar_max_range are treated as "no detection":
    # the ray is cleared up to lidar_max_range and no obstacle is marked.
    # Set to 0.0 to use the range_max reported in the LaserScan message.
    lidar_max_range: 0.0       # meters (e.g. 12.0), 0.0 = use scan range_max
    transform_tolerance: 0.1   # s - max wait for the robot TF at the scan timestamp,
                               # falls back to the latest TF if not available
    

    # Map memory parameters
    obstacle_decay_time: 1.0      # Start decay after 1 second
    max_obstacle_age: 10.0      # Remove after 10 seconds
    min_detection_count: 2         # Need 2+ hits to mark as obstacle
    enable_memory_cleanup: true    # Enable periodic cleanup
    cleanup_period: 15.0           # s (node clock) - period of the decay/cleanup pass


